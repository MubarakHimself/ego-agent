[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipstream"
version = "0.1.0"
description = "Browser Pool Manager MVP — lease/heartbeat/release for K=5 Chromium CDP slots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MubarakHimself" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "vulture>=2.11",
]
vault = [
    "keyring>=25.0",
    "cryptography>=42.0",
]
# Real CDP fill over WebSocket (optional; mock used in tests)
cdp = [
    "websocket-client>=1.8",
]

[project.scripts]
slipstream = "slipstream.__main__:main"

[tool.setuptools.packages.find]
include = ["slipstream*", "skills*"]

[tool.setuptools.package-data]
"skills.slipstream" = ["SKILL.md", "*.md"]

[tool.pytest.ini_options]
markers = [
    "live: optional live smoke requiring a real Chrome/Chromium binary",
    "live_stress: live out-of-box stress/edge cases requiring real Chrome",
    "bench: optional pool speed benchmark (MOCK or LIVE)",
]
testpaths = ["tests"]

[tool.vulture]
min_confidence = 80
paths = ["slipstream"]
exclude = [".venv*", "**/__pycache__/**", ".venv-skylos", "tests"]


# Skylos local gate (see docs/SKYLOS.md). Security criticals must stay at 0.
# Quality backlog (string-dupe / complexity / long functions) tracked separately —
# max_quality raised so Captain security gate can exit 0 without mass refactors.
[tool.skylos]
exclude = [".venv", ".venv-skylos", "*.egg-info", "benches", "data", "tests", "scripts"]
ignore = [
  # Optional websocket import is declared under [project.optional-dependencies] cdp.
  "SKY-D223",
]

[tool.skylos.gate]
fail_on_critical = true
max_critical = 0
max_high = 0
max_security = 0
max_reliability = 0
# Quality backlog waiver: SKY-L027/Q301/C304/etc. across vault/doctor/api/pool.
# Lowered 280→250 after slipstream-quality-debt-001 real dedupe/helpers (gate ~242).
# Raised 250→260 for slipstream-downloads-001; lowered 260→250 after
# slipstream-downloads-adv-fix-001 real claw (CDP split + L027 consts; gate ≤250).
# security caps stay 0. Prefer pay-down over further raises.
max_quality = 250
max_secrets = 0
max_dependency_vulnerabilities = 0
max_ai_defects = 5
strict = false

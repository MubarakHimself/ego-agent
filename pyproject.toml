[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipstream"
version = "0.1.0"
description = "Browser Pool Manager MVP — lease/heartbeat/release for K=5 Chromium CDP slots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MubarakHimself" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "vulture>=2.11",
]

[project.scripts]
slipstream = "slipstream.__main__:main"

[tool.setuptools.packages.find]
include = ["slipstream*"]

[tool.pytest.ini_options]
markers = [
    "live: optional live smoke requiring a real Chrome/Chromium binary",
    "live_stress: live out-of-box stress/edge cases requiring real Chrome",
    "bench: optional pool speed benchmark (MOCK or LIVE)",
]
testpaths = ["tests"]

[tool.vulture]
min_confidence = 80
paths = ["slipstream"]
exclude = [".venv*", "**/__pycache__/**", ".venv-skylos", "tests"]
